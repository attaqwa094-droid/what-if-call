
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What If I Call - Cinematic</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    overflow: hidden;
    background: #11182a;
    color: white;
}

/* ===== CINEMATIC SKY ===== */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
      linear-gradient(to bottom,
        #111a32 0%,
        #293451 35%,
        #76566b 68%,
        #d18a72 100%);
}

/* Stars */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 7px white;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; }
    to { opacity: 1; }
}

/* Moon */

.moon {
    position: absolute;
    width: 75px;
    height: 75px;
    top: 10%;
    right: 15%;
    background: #f5e9ce;
    border-radius: 50%;
    box-shadow: 0 0 45px #fff2cf88;
    animation: moonFloat 7s ease-in-out infinite;
}

@keyframes moonFloat {
    50% { transform: translateY(-10px); }
}

/* ===== CLOUDS ===== */

.cloud {
    position: absolute;
    width: 150px;
    height: 30px;
    background: #ffffff17;
    border-radius: 50%;
    filter: blur(10px);
    animation: cloudMove 45s linear infinite;
}

.cloud.one {
    top: 25%;
    left: -180px;
}

.cloud.two {
    top: 40%;
    left: -250px;
    animation-delay: -20s;
}

@keyframes cloudMove {
    to { transform: translateX(130vw); }
}

/* ===== LYRICS ===== */

.lyrics {
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    text-align: center;
    z-index: 20;
    pointer-events: none;
}

.lyric-line {
    font-size: clamp(19px, 3vw, 30px);
    line-height: 1.5;
    letter-spacing: 1px;
    color: #fff8ed;
    text-shadow:
      0 2px 10px #10101b,
      0 0 25px #ffffff66;
    opacity: 0;
    transition: opacity 1.5s ease;
}

.lyric-line.show {
    opacity: 1;
}

.lyric-line.hide {
    opacity: 0;
}

/* ===== GRASS FIELD ===== */

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 37%;
    background:
      linear-gradient(to bottom,
       #263c35,
       #142c26 60%,
       #0c201c);
    clip-path: polygon(0 18%, 20% 5%, 45% 17%,
    70% 4%, 100% 15%, 100% 100%, 0 100%);
}

/* Grass */

.grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 30%;
    background: repeating-linear-gradient(
       95deg,
       transparent 0 9px,
       #557052 10px 11px,
       transparent 12px 20px
    );
    opacity: .45;
    animation: grassMove 3s ease-in-out infinite alternate;
}

@keyframes grassMove {
    from { transform: skewX(-1deg); }
    to { transform: skewX(2deg); }
}

/* ===== TREE ===== */

.tree {
    position: absolute;
    bottom: 25%;
    left: 24%;
    width: 30px;
    height: 220px;
    background: linear-gradient(90deg,#281e1c,#594033,#261b19);
    transform: rotate(3deg);
    border-radius: 30%;
    z-index: 5;
}

.branch {
    position: absolute;
    width: 100px;
    height: 12px;
    background: #493329;
    top: 45px;
    left: -50px;
    transform: rotate(-35deg);
    border-radius: 50%;
}

.leaves {
    position: absolute;
    width: 240px;
    height: 125px;
    top: -65px;
    left: -105px;
    background: radial-gradient(
       ellipse at 50% 50%,
       #304b3d 0%,
       #253b32 60%,
       #1b302a 100%
    );
    border-radius: 50%;
    box-shadow: 15px 10px 20px #101d1a66;
    animation: leavesMove 4s ease-in-out infinite alternate;
}

@keyframes leavesMove {
    to { transform: rotate(2deg) translateY(3px); }
}

/* ===== TWO PEOPLE ===== */

.people {
    position: absolute;
    bottom: 25%;
    left: 28%;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    z-index: 8;
}

/* silhouettes */

.person {
    position: relative;
    width: 35px;
    height: 85px;
}

.head {
    position: absolute;
    width: 19px;
    height: 21px;
    border-radius: 50%;
    background: #111519;
    top: 0;
    left: 7px;
}

.body {
    position: absolute;
    width: 32px;
    height: 46px;
    background: #111519;
    top: 20px;
    left: 1px;
    border-radius: 12px 12px 4px 4px;
}

.legs {
    position: absolute;
    width: 45px;
    height: 9px;
    background: #111519;
    top: 63px;
    left: -5px;
    border-radius: 50%;
}

.person.girl {
    transform: scale(.92);
}

/* ===== BIRDS ===== */

.birds {
    position: absolute;
    top: 22%;
    left: -100px;
    font-size: 23px;
    letter-spacing: 8px;
    color: #141c2b;
    animation: birdsFly 25s linear infinite;
    z-index: 4;
}

@keyframes birdsFly {
    from { left: -120px; transform: translateY(0); }
    50% { transform: translateY(-25px); }
    to { left: 110%; transform: translateY(5px); }
}

/* ===== AIRPLANE ===== */

.plane {
    position: absolute;
    top: 35%;
    left: -100px;
    font-size: 27px;
    animation: planeFly 35s linear infinite;
    animation-delay: -8s;
    z-index: 3;
}

@keyframes planeFly {
    to {
        left: 115%;
        transform: translateY(-30px);
    }
}

/* ===== SHOOTING STAR ===== */

.shooting {
    position: absolute;
    top: 18%;
    left: 70%;
    width: 100px;
    height: 2px;
    background: linear-gradient(to right,
      white, transparent);
    transform: rotate(-35deg);
    opacity: 0;
    animation: shootingStar 8s infinite;
}

@keyframes shootingStar {
    0%, 65% { opacity: 0; transform: translate(0,0) rotate(-35deg); }
    68% { opacity: 1; }
    78% { opacity: 0; transform: translate(-180px,120px) rotate(-35deg); }
    100% { opacity: 0; }
}

/* ===== MUSIC PLAYER ===== */

.music-card {
    position: absolute;
    bottom: 22px;
    left: 22px;
    width: 300px;
    padding: 16px;
    border: 1px solid #ffffff35;
    border-radius: 17px;
    background: #101624aa;
    backdrop-filter: blur(15px);
    z-index: 30;
    box-shadow: 0 8px 35px #0006;
}

.music-info {
    display: flex;
    gap: 13px;
    align-items: center;
}

.cover {
    width: 65px;
    height: 65px;
    flex-shrink: 0;
    border-radius: 12px;
    background: linear-gradient(135deg,#b68c9e,#334c63,#17232d);
    display: grid;
    place-items: center;
    font-size: 30px;
    box-shadow: 0 0 20px #d9c4dd44;
}

.cover.playing {
    animation: coverGlow 2s infinite alternate;
}

@keyframes coverGlow {
    to { box-shadow: 0 0 30px #f2c6ff99; }
}

.song-title {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
}

.artist {
    color: #c9b9c6;
    font-size: 12px;
    margin-top: 6px;
}

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    margin-top: 15px;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    background: transparent;
    font-size: 20px;
}

.play {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #e8c6d8;
    color: #292030;
}

.progress {
    width: 100%;
    margin-top: 12px;
    accent-color: #e8c6d8;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #d2c6d2;
}

.volume {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
}

.volume input {
    width: 85px;
}

.credit {
    margin-top: 10px;
    font-size: 9px;
    text-align: center;
    letter-spacing: 2px;
    color: #a99baa;
}

/* Small decorations */

.fireflies {
    position: absolute;
    bottom: 20%;
    left: 55%;
    color: #f8d99a;
    font-size: 12px;
    animation: firefly 4s infinite alternate;
}

@keyframes firefly {
    from { opacity: .1; transform: translateY(0); }
    to { opacity: 1; transform: translateY(-25px); }
}

/* Mobile */

@media(max-width:600px) {
    .tree {
        left: 15%;
        transform: scale(.8);
        transform-origin: bottom;
    }

    .people {
        left: 22%;
        transform: scale(.8);
        transform-origin: bottom;
    }

    .music-card {
        width: 270px;
        left: 12px;
        bottom: 12px;
    }

    .lyrics {
        top: 15%;
        width: 92%;
    }

    .moon {
        width: 55px;
        height: 55px;
    }
}

/* =================================
   CINEMATIC BACKGROUND UPGRADE
================================= */

/* Efek kamera */
.scene {
    animation: cinematicZoom 25s ease-in-out infinite alternate;
}

@keyframes cinematicZoom {
    from { transform: scale(1); }
    to { transform: scale(1.055); }
}

/* Cahaya horizon */
.scene::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: 23%;
    width: 100%;
    height: 35%;
    background: radial-gradient(
        ellipse at 50% 100%,
        #e6a17a55,
        #bd809333 35%,
        transparent 75%
    );
    pointer-events: none;
    z-index: 1;
}

/* Efek vignette seperti film */
.scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        ellipse,
        transparent 45%,
        #080c1b44 100%
    );
    pointer-events: none;
    z-index: 25;
}

/* Bulan lebih bercahaya */
.moon {
    box-shadow:
        0 0 25px #fff3d8aa,
        0 0 70px #fff0c655,
        0 0 120px #fff0c622;
}

/* Pohon lebih natural */
.tree {
    height: 235px;
    width: 32px;
    box-shadow: 5px 0 12px #080d0b55;
}

.leaves {
    width: 260px;
    height: 145px;
    left: -115px;
    background:
        radial-gradient(ellipse at 30% 35%, #49664c, transparent 38%),
        radial-gradient(ellipse at 65% 30%, #3e5b43, transparent 40%),
        radial-gradient(ellipse at 50% 65%, #263f31 0%, #182e27 75%);
    box-shadow:
        0 12px 30px #080d0b88,
        inset 0 -10px 20px #101d17;
}

/* Dua orang duduk berdampingan */
.people {
    bottom: 26%;
    left: 27%;
    gap: 9px;
}

.person {
    width: 42px;
    height: 65px;
}

.head {
    width: 18px;
    height: 20px;
    top: 0;
    left: 11px;
}

.body {
    width: 31px;
    height: 34px;
    top: 19px;
    left: 4px;
    border-radius: 12px 12px 5px 5px;
}

/* Kaki dalam posisi duduk */
.legs {
    width: 51px;
    height: 8px;
    top: 47px;
    left: -8px;
    transform: rotate(-7deg);
    border-radius: 50%;
}

.person::after {
    content: "";
    position: absolute;
    width: 38px;
    height: 7px;
    background: #111519;
    top: 55px;
    left: 8px;
    border-radius: 50%;
    transform: rotate(12deg);
}

/* Rumput lebih berlapis */
.ground {
    box-shadow: 0 -15px 35px #172d25;
}

.grass {
    background: repeating-linear-gradient(
        95deg,
        transparent 0 7px,
        #80916a55 8px 9px,
        transparent 10px 17px
    );
    transform-origin: bottom;
}

/* Burung lebih halus */
.birds {
    font-size: 19px;
    opacity: .8;
    animation-duration: 30s;
}

/* Pesawat lebih lembut */
.plane {
    opacity: .75;
    font-size: 23px;
}

/* Kunang-kunang tambahan */
.fireflies {
    animation: firefly 3s ease-in-out infinite alternate;
    text-shadow: 0 0 12px #ffe6a5;
}

/* Cahaya bintang lebih lembut */
.star {
    box-shadow: 0 0 5px #ffffffaa;
}

/* Responsif */
@media(max-width:600px) {
    .scene {
        animation-duration: 35s;
    }

    .tree {
        left: 12%;
    }

    .people {
        left: 21%;
        bottom: 26%;
    }

    .leaves {
        width: 220px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="stars" id="stars"></div>
    <div class="moon"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="shooting"></div>

    <!-- Birds -->
    <div class="birds">⌁　⌁　⌁</div>

    <!-- Airplane -->
    <div class="plane">✈</div>

    <!-- Lyrics -->
    <div class="lyrics">
        <div class="lyric-line" id="lyric">
        </div>
    </div>

    <!-- Grass -->
    <div class="ground"></div>
    <div class="grass"></div>

    <!-- Tree -->
    <div class="tree">
        <div class="branch"></div>
        <div class="leaves"></div>
    </div>

    <!-- Couple -->
    <div class="people">
        <div class="person boy">
            <div class="head"></div>
            <div class="body"></div>
            <div class="legs"></div>
        </div>

        <div class="person girl">
            <div class="head"></div>
            <div class="body"></div>
            <div class="legs"></div>
        </div>
    </div>

    <div class="fireflies">✦　✧　✦</div>

    <!-- Music Player -->
    <div class="music-card">

        <div class="music-info">
            <div class="cover" id="cover">🌙</div>

            <div>
                <div class="song-title">What If I Call?</div>
                <div class="artist">Alex Crichton</div>
            </div>
        </div>

        <audio id="audio" src="what-if-i-call.mp3"></audio>

        <div class="progress">
            <input type="range" id="seek"
            min="0" max="100" value="0">

            <div class="time">
                <span id="current">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button id="restart">↺</button>
            <button class="play" id="play">▶</button>
            <button id="mute">♫</button>
        </div>

        <div class="volume">
            <span>♪</span>
            <input type="range" id="volume"
            min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="credit">A LITTLE MEMORY UNDER THE STARS</div>

    </div>
</div>

<script>

// ===== STARS =====

const stars = document.getElementById("stars");

for (let i = 0; i < 120; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.opacity = Math.random();
    stars.appendChild(star);
}

// ===== MUSIC =====

const audio = document.getElementById("audio");
const play = document.getElementById("play");
const cover = document.getElementById("cover");
const seek = document.getElementById("seek");
const lyric = document.getElementById("lyric");

let lyricTimer = null;
let lyricIndex = 0;
let lyricStartTime = 0;

// ===== LYRICS =====
// Angka duration adalah perkiraan lama tampilan setiap baris.
// Sesuaikan start/duration berdasarkan audio asli agar tepat.

const lyrics = [
    { text: "So what if I call?", duration: 3.2 },
    { text: "And you pick up the phone?", duration: 3.2 },
    { text: "And I use this holiday", duration: 3.2 },
    { text: "To make my way to your ghost", duration: 3.5 },

    { text: "You walked in the party, your coat was untied", duration: 4.5 },
    { text: "Slammin' the door 'cause it's colder outside", duration: 4.5 },
    { text: "Now I won't forget that moment like the blink of an eye", duration: 4.8 },
    { text: "You're off to the beach now 'til the weather gets nice", duration: 4.5 },

    { text: "But what if I call?", duration: 3.2 },
    { text: "And you pick up the phone?", duration: 3.2 },
    { text: "And I use this holiday to make my way to your ghost", duration: 4.5 },

    { text: "But, what if you're lonely?", duration: 3.2 },
    { text: "And you know I am too?", duration: 3.2 },
    { text: "And I get the chance to say", duration: 3.2 },
    { text: "\"I wish I didn't, but I miss you\"", duration: 4.5 },

    { text: "I miss you", duration: 2.8 },
    { text: "You know it's true", duration: 2.8 },
    { text: "Yeah, I miss you", duration: 2.8 },
    { text: "You know it's true", duration: 3.2 },

    { text: "So, what if I call?", duration: 3.2 },
    { text: "And you pick up the phone?", duration: 3.2 },
    { text: "And I use this holiday to make my way to your ghost", duration: 4.5 },

    { text: "But, what if you're lonely?", duration: 3.2 },
    { text: "And you know I am too?", duration: 3.2 },
    { text: "And I get the chance to say", duration: 3.2 },
    { text: "\"I wish I didn't, but I miss you\"", duration: 4.5 },
    { text: "I miss you", duration: 4 }
];

// ===== LYRIC ANIMATION =====

function showLyric() {
    if (audio.paused) return;

    if (lyricIndex >= lyrics.length) {
        lyric.textContent = "";
        lyric.className = "lyric-line";
        return;
    }

    const item = lyrics[lyricIndex];

    lyric.textContent = item.text;

    lyric.className = "lyric-line";
    
    requestAnimationFrame(() => {
        lyric.classList.add("show");
    });

    lyricTimer = setTimeout(() => {

        lyric.classList.remove("show");
        lyric.classList.add("hide");

        lyricTimer = setTimeout(() => {
            lyricIndex++;
            showLyric();
        }, 1500);

    }, item.duration * 1000);
}

function startLyrics() {
    stopLyrics();

    // Delay awal 3 detik
    lyricStartTime = setTimeout(() => {
        if (!audio.paused) {
            showLyric();
        }
    }, 3000);
}

function stopLyrics() {
    clearTimeout(lyricStartTime);
    clearTimeout(lyricTimer);

    lyric.className = "lyric-line";
    lyric.textContent = "";
}

// ===== PLAY PAUSE =====

play.addEventListener("click", async () => {

    if (audio.paused) {
        try {
            await audio.play();
        } catch (error) {
            alert("File MP3 belum ditemukan!");
        }
    } else {
        audio.pause();
    }

});

audio.addEventListener("play", () => {
    play.textContent = "Ⅱ";
    cover.classList.add("playing");

    startLyrics();
});

audio.addEventListener("pause", () => {
    play.textContent = "▶";
    cover.classList.remove("playing");

    stopLyrics();
});

audio.addEventListener("ended", () => {
    stopLyrics();
    play.textContent = "▶";
    lyricIndex = 0;
});

// ===== TIME =====

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);

    return min + ":" + String(sec).padStart(2, "0");
}

audio.addEventListener("loadedmetadata", () => {
    document.getElementById("duration").textContent =
        formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        seek.value = audio.currentTime / audio.duration * 100;

        document.getElementById("current").textContent =
            formatTime(audio.currentTime);
    }
});

seek.addEventListener("input", () => {
    if (audio.duration) {
        audio.currentTime = seek.value / 100 * audio.duration;
    }
});

// Restart

document.getElementById("restart").onclick = () => {
    audio.currentTime = 0;
    lyricIndex = 0;

    if (!audio.paused) {
        startLyrics();
    }
};

// Volume

document.getElementById("volume").oninput = (e) => {
    audio.volume = e.target.value;
};

// Mute

document.getElementById("mute").onclick = () => {
    audio.muted = !audio.muted;
    document.getElementById("mute").textContent =
        audio.muted ? "×" : "♫";
};

</script>

</body>
</html>
