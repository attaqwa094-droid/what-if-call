
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What If I Call - Night Experience</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: Georgia, serif;
    background: #080e1d;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    isolation: isolate;
    background: linear-gradient(
        to bottom,
        #080d20 0%,
        #111b37 38%,
        #28354d 72%,
        #354d3d 100%
    );
}

/* ===== LANGIT DAN BINTANG ===== */

.sky-stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
        radial-gradient(2px 2px at 8% 12%, white, transparent),
        radial-gradient(1px 1px at 18% 28%, white, transparent),
        radial-gradient(2px 2px at 30% 8%, white, transparent),
        radial-gradient(1px 1px at 42% 18%, white, transparent),
        radial-gradient(2px 2px at 54% 9%, white, transparent),
        radial-gradient(1px 1px at 67% 27%, white, transparent),
        radial-gradient(2px 2px at 83% 12%, white, transparent),
        radial-gradient(1px 1px at 95% 30%, white, transparent),
        radial-gradient(1px 1px at 12% 43%, white, transparent),
        radial-gradient(2px 2px at 45% 35%, white, transparent),
        radial-gradient(1px 1px at 72% 44%, white, transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
}

@keyframes twinkle {
    from { opacity: .45; }
    to { opacity: 1; }
}

/* Bulan */
.moon {
    position: absolute;
    top: 9%;
    right: 18%;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: #fff5d5;
    box-shadow:
        0 0 20px #fff2c4,
        0 0 65px rgba(255,239,195,.35);
    z-index: 1;
}

.moon::after {
    content: "";
    position: absolute;
    top: -10px;
    left: 24px;
    width: 78px;
    height: 78px;
    background: #111a35;
    border-radius: 50%;
}

/* ===== METEOR: DI BELAKANG GUNUNG ===== */

#meteorCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* ===== PEGUNUNGAN ===== */

.mountains {
    position: absolute;
    bottom: 27%;
    left: 0;
    width: 100%;
    height: 43%;
    z-index: 2;
    filter: brightness(.58);
}

.mountain {
    position: absolute;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 260px solid #40536a;
}

.m1 {
    left: -5%;
    transform: scale(1.1);
}

.m2 {
    left: 22%;
    transform: scale(1.35);
    border-bottom-color: #53677b;
}

.m3 {
    right: 5%;
    transform: scale(1.45);
    border-bottom-color: #354a5d;
}

.m4 {
    right: 35%;
    transform: scale(.9);
    border-bottom-color: #45596d;
}

/* Kabut pegunungan */
.mist {
    position: absolute;
    bottom: 27%;
    width: 100%;
    height: 100px;
    z-index: 2;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(179,198,206,.12),
        transparent
    );
    filter: blur(15px);
}

/* ===== BUKIT DAN PADANG RUMPUT ===== */

.hill {
    position: absolute;
    left: -15%;
    bottom: -24%;
    width: 130%;
    height: 63%;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(
        145deg,
        #456b46,
        #1c382b 80%
    );
    z-index: 3;
}

.hill2 {
    position: absolute;
    right: -18%;
    bottom: -15%;
    width: 75%;
    height: 58%;
    border-radius: 55% 45% 0 0;
    background: linear-gradient(
        145deg,
        #486d43,
        #1a3226
    );
    z-index: 4;
}

/* Rumput */
.grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 26%;
    z-index: 5;
    opacity: .5;
    background: repeating-linear-gradient(
        78deg,
        transparent 0 8px,
        rgba(14,42,24,.5) 9px 10px,
        transparent 11px 17px
    );
}

/* ===== BURUNG MIGRASI ===== */

.bird-flock {
    position: absolute;
    top: 23%;
    left: -220px;
    width: 220px;
    height: 90px;
    z-index: 3;
    animation: flockMove 30s linear infinite;
}

.bird {
    position: absolute;
    width: 42px;
    height: 25px;
    animation: birdWing 1.2s ease-in-out infinite;
}

.bird svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    fill: #080e1b;
}

.bird:nth-child(1) { left: 0; top: 30px; }
.bird:nth-child(2) { left: 55px; top: 5px; animation-delay: -.3s; }
.bird:nth-child(3) { left: 105px; top: 42px; animation-delay: -.6s; }
.bird:nth-child(4) { left: 155px; top: 15px; animation-delay: -.9s; }

@keyframes flockMove {
    from { transform: translateX(-100px); }
    to { transform: translateX(130vw); }
}

@keyframes birdWing {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-4px) scaleY(.72); }
}

/* ===== POHON APEL ===== */

.tree {
    position: absolute;
    right: 8%;
    bottom: 20%;
    width: 300px;
    height: 350px;
    z-index: 6;
    filter: brightness(.72);
}

.trunk {
    position: absolute;
    bottom: 0;
    left: 47%;
    width: 43px;
    height: 210px;
    background: linear-gradient(90deg,#392519,#805333);
    border-radius: 12px;
    transform: rotate(-5deg);
}

.leaves {
    position: absolute;
    top: 0;
    width: 300px;
    height: 220px;
    background: radial-gradient(
        circle at 35% 35%,
        #648a48,
        #25452b 80%
    );
    border-radius: 50%;
    box-shadow:
        -40px 30px 0 -12px #385d32,
        40px 30px 0 -10px #436c37,
        0 -20px 0 -5px #547c3e,
        0 15px 30px rgba(0,0,0,.3);
}

.apple {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #b92e31;
    border-radius: 50%;
    box-shadow: inset -3px -3px 3px #761e20;
    z-index: 2;
}

.a1 { top: 55px; left: 70px; }
.a2 { top: 110px; left: 205px; }
.a3 { top: 145px; left: 120px; }
.a4 { top: 80px; left: 245px; }

/* ===== PASANGAN ===== */

.couple {
    position: absolute;
    right: 18%;
    bottom: 23%;
    width: 190px;
    height: 145px;
    z-index: 7;
}

/* Laki-laki */
.person {
    position: absolute;
    bottom: 0;
    width: 75px;
    height: 100px;
}

.boy {
    left: 20px;
}

.girl {
    right: 18px;
    transform: rotate(-12deg);
    transform-origin: bottom center;
}

.head {
    position: absolute;
    top: -25px;
    left: 20px;
    width: 36px;
    height: 40px;
    border-radius: 50%;
    background: #ad8064;
}

.body {
    position: absolute;
    top: 15px;
    width: 68px;
    height: 75px;
    border-radius: 25px 25px 10px 10px;
}

.boy .body {
    background: #23394b;
}

.girl .body {
    background: #75434e;
}

.girl .head {
    top: -27px;
    left: 5px;
    transform: rotate(-20deg);
}

.girl .head::before {
    content: "";
    position: absolute;
    width: 44px;
    height: 47px;
    background: #231b1a;
    border-radius: 50%;
    top: -7px;
    left: -5px;
    z-index: -1;
}

/* Kaki */
.person::after {
    content: "";
    position: absolute;
    bottom: -9px;
    left: -12px;
    width: 90px;
    height: 17px;
    border-radius: 50%;
    background: #17231e;
}

/* Tangan berpegangan */
.hands {
    position: absolute;
    top: 62px;
    left: 77px;
    width: 42px;
    height: 9px;
    border-radius: 10px;
    background: #ad8064;
    transform: rotate(-10deg);
    z-index: 8;
}

/* Love */
.heart {
    position: absolute;
    color: #ff8aa7;
    font-size: 20px;
    text-shadow: 0 0 12px #ff547d;
    z-index: 8;
    animation: floatHeart 4s ease-in-out infinite;
}

.h1 { right: 16%; bottom: 42%; }
.h2 { right: 25%; bottom: 48%; animation-delay: 1s; }
.h3 { right: 11%; bottom: 52%; animation-delay: 2s; }

@keyframes floatHeart {
    0% { transform: translateY(10px) scale(.7); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
}

/* ===== BUNGA ===== */

.flower {
    position: absolute;
    bottom: 12%;
    z-index: 6;
    filter: brightness(.75);
    font-size: 22px;
}

.f1 { left: 40%; }
.f2 { left: 65%; }
.f3 { left: 80%; }

/* ===== LIRIK ===== */

.lyric {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translate(-50%,20px);
    width: 85%;
    text-align: center;
    color: #fff9e9;
    font-size: clamp(20px,3vw,34px);
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 12px #a5c8e8, 0 3px 15px #000;
    opacity: 0;
    z-index: 9;
    transition: opacity 1.5s ease, transform 1.5s ease;
    pointer-events: none;
}

.lyric.show {
    opacity: 1;
    transform: translate(-50%,0);
}

/* ===== MUSIC PLAYER ===== */

.player {
    position: absolute;
    left: 25px;
    bottom: 25px;
    z-index: 12;
    width: 300px;
    padding: 20px;
    color: white;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px;
    background: rgba(9,19,35,.82);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

.player h2 {
    font-size: 20px;
    margin-bottom: 5px;
}

.player p {
    font-size: 13px;
    color: #c5d2e2;
    margin-bottom: 13px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    border: none;
    background: #e7d6a5;
    color: #354632;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: white;
}

#progress {
    width: 100%;
    margin-top: 13px;
    accent-color: #e7d6a5;
    cursor: pointer;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-top: 5px;
}

/* ===== RESPONSIVE ===== */

@media(max-width:600px) {
    .player {
        width: 270px;
        left: 50%;
        transform: translateX(-50%);
        bottom: 15px;
    }

    .tree {
        right: -8%;
        transform: scale(.72);
        transform-origin: bottom right;
    }

    .couple {
        right: 19%;
        transform: scale(.8);
        transform-origin: bottom right;
    }

    .moon {
        width: 65px;
        height: 65px;
    }

    .mountain {
        border-left-width: 110px;
        border-right-width: 110px;
    }

    .lyric {
        top: 12%;
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- Langit -->
    <div class="sky-stars"></div>
    <div class="moon"></div>

    <!-- Canvas meteor di belakang pegunungan -->
    <canvas id="meteorCanvas"></canvas>

    <!-- Burung -->
    <div class="bird-flock">

        <div class="bird">
            <svg viewBox="0 0 50 30">
                <path d="M2 12 Q12 -2 25 13 Q38 -2 48 12 Q36 8 25 20 Q14 8 2 12Z"/>
            </svg>
        </div>

        <div class="bird">
            <svg viewBox="0 0 50 30">
                <path d="M2 12 Q12 -2 25 13 Q38 -2 48 12 Q36 8 25 20 Q14 8 2 12Z"/>
            </svg>
        </div>

        <div class="bird">
            <svg viewBox="0 0 50 30">
                <path d="M2 12 Q12 -2 25 13 Q38 -2 48 12 Q36 8 25 20 Q14 8 2 12Z"/>
            </svg>
        </div>

        <div class="bird">
            <svg viewBox="0 0 50 30">
                <path d="M2 12 Q12 -2 25 13 Q38 -2 48 12 Q36 8 25 20 Q14 8 2 12Z"/>
            </svg>
        </div>

    </div>

    <!-- Pegunungan berada di depan meteor -->
    <div class="mountains">
        <div class="mountain m1"></div>
        <div class="mountain m2"></div>
        <div class="mountain m3"></div>
        <div class="mountain m4"></div>
    </div>

    <div class="mist"></div>

    <!-- Padang rumput -->
    <div class="hill"></div>
    <div class="hill2"></div>
    <div class="grass"></div>

    <!-- Pohon apel -->
    <div class="tree">
        <div class="leaves"></div>
        <div class="trunk"></div>
        <div class="apple a1"></div>
        <div class="apple a2"></div>
        <div class="apple a3"></div>
        <div class="apple a4"></div>
    </div>

    <!-- Pasangan -->
    <div class="couple">

        <div class="person boy">
            <div class="head"></div>
            <div class="body"></div>
        </div>

        <div class="person girl">
            <div class="head"></div>
            <div class="body"></div>
        </div>

        <div class="hands"></div>
    </div>

    <!-- Hati -->
    <div class="heart h1">♥</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">♥</div>

    <!-- Bunga -->
    <div class="flower f1">🌼</div>
    <div class="flower f2">🌸</div>
    <div class="flower f3">🌼</div>

    <!-- Lirik -->
    <div class="lyric" id="lyric"></div>

    <!-- Pemutar musik -->
    <div class="player">
        <h2>♫ What If I Call?</h2>
        <p>Music Experience • Night Edition</p>

        <div class="controls">
            <button id="playBtn">▶ PLAY</button>
            <span id="status">Ready to play</span>
        </div>

        <input type="range" id="progress"
        min="0" max="100" value="0">

        <div class="time">
            <span id="current">0:00</span>
            <span id="duration">--:--</span>
        </div>
    </div>

    <audio id="audio" preload="metadata">
        <source src="what-if-i-call.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

// ==================================
// METEOR SYSTEM
// Canvas berada DI BELAKANG gunung
// ==================================

const canvas = document.getElementById("meteorCanvas");
const ctx = canvas.getContext("2d");

let W, H;
let meteors = [];
let spawnTimer = 0;

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createMeteor() {

    const startX = Math.random() * W;
    const startY = -20 - Math.random() * 130;

    const angle = (35 + Math.random() * 35)
        * Math.PI / 180;

    const speed = 5 + Math.random() * 5;

    meteors.push({
        x: startX,
        y: startY,

        vx: -Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,

        length: 100 + Math.random() * 150,
        width: 1 + Math.random() * 1.5,

        opacity: 0,
        life: 0,
        maxLife: 65 + Math.random() * 40,

        color: Math.random() > .5
            ? "175,215,255"
            : "255,240,210"
    });
}

function drawMeteor(m) {

    const tailX = m.x - m.vx * (m.length / 12);
    const tailY = m.y - m.vy * (m.length / 12);

    const gradient = ctx.createLinearGradient(
        m.x, m.y, tailX, tailY
    );

    gradient.addColorStop(
        0, `rgba(255,255,255,${m.opacity})`
    );

    gradient.addColorStop(
        .2, `rgba(${m.color},${m.opacity * .8})`
    );

    gradient.addColorStop(
        1, "rgba(100,150,255,0)"
    );

    // Ekor mengikuti posisi kepala
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tailX, tailY);

    ctx.strokeStyle = gradient;
    ctx.lineWidth = m.width;
    ctx.lineCap = "round";

    ctx.shadowBlur = 12;
    ctx.shadowColor = "#b8dfff";
    ctx.stroke();

    // Kepala meteor
    ctx.beginPath();
    ctx.arc(m.x, m.y, 2.3, 0, Math.PI * 2);

    ctx.fillStyle =
        `rgba(255,255,255,${m.opacity})`;

    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ffffff";
    ctx.fill();

    ctx.shadowBlur = 0;
}

function animateMeteors() {

    ctx.clearRect(0, 0, W, H);

    spawnTimer++;

    if (spawnTimer > 75 + Math.random() * 100) {
        createMeteor();
        spawnTimer = 0;
    }

    for (let i = meteors.length - 1; i >= 0; i--) {

        const m = meteors[i];

        m.life++;

        // Akselerasi
        m.vx *= 1.008;
        m.vy *= 1.008;

        m.x += m.vx;
        m.y += m.vy;

        const fadeIn = Math.min(m.life / 8, 1);
        const fadeOut = Math.min(
            (m.maxLife - m.life) / 15, 1
        );

        m.opacity = Math.max(
            0,
            Math.min(fadeIn, fadeOut)
        );

        drawMeteor(m);

        if (
            m.life >= m.maxLife ||
            m.x < -250 ||
            m.y > H + 200
        ) {
            meteors.splice(i, 1);
        }
    }

    requestAnimationFrame(animateMeteors);
}

animateMeteors();


// ==================================
// MUSIC PLAYER DAN LIRIK
// ==================================

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const lyric = document.getElementById("lyric");
const progress = document.getElementById("progress");
const statusText = document.getElementById("status");

let activeIndex = -1;

// Masukkan lirik milikmu dan waktu kemunculannya.
// Waktu menggunakan detik dari awal lagu.

const lyrics = [
    {time:3, text:"So what if I call?"},
    {time:7, text:"And you pick up the phone?"},
    {time:11, text:"And I use this holiday"},
    {time:14, text:"To make my way to your ghost"},
    {time:23, text:"You walked in the party, your coat was untied"},
    {time:33, text:"Slammin' the door 'cause it's colder outside"},
    {time:41, text:"Now I won't forget that moment like the blink of an eye"},
    {time:51, text:"You're off to the beach now 'til the weather gets nice"},
    {time:58, text:"But what if I call?"},
    {time:62, text:"And you pick up the phone?"},
    {time:67, text:"And I use this holiday"},
    {time:70, text:"to make my way to your ghost"},
    {time:76, text:"Oh, what if you're lonely?"},
    {time:80, text:"And you know I am too?"},
    {time:85, text:"And I get the chance to say"},
    {time:88, text:"I wish I didn't, but I miss you"},
    {time:94, text:"I miss you"},
    {time:99, text:"You know it's true"},
    {time:104, text:"Yeah, I miss you"},
    {time:108, text:"You know it's true"},
    {time:113, text:"So, what if I call?"},
    {time:117, text:"And you pick up the phone?"},
    {time:122, text:"And I use this holiday"},
    {time:125, text:"to make my way to your ghost"},
    {time:131, text:"But, what if you're lonely?"},
    {time:136, text:"And you know I am too?"},
    {time:140, text:"And I get the chance to say"},
    {time:144, text:"I wish I didn't, but I miss you"},
    {time:149, text:"I miss you"},
];

const lyricDuration = 3.5;

function updateLyrics() {

    if (audio.paused) return;

    const now = audio.currentTime;

    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {

        if (
            now >= lyrics[i].time &&
            now < lyrics[i].time + lyricDuration
        ) {
            index = i;
            break;
        }
    }

    if (index !== activeIndex) {

        activeIndex = index;
        lyric.classList.remove("show");

        if (index >= 0) {

            setTimeout(() => {

                if (
                    !audio.paused &&
                    activeIndex === index
                ) {
                    lyric.textContent = lyrics[index].text;
                    lyric.classList.add("show");
                }

            }, 150);

        }
    }

    requestAnimationFrame(updateLyrics);
}

// Play dan Pause
playBtn.addEventListener("click", async () => {

    if (audio.paused) {

        try {

            await audio.play();

            playBtn.textContent = "❚❚ PAUSE";
            statusText.textContent = "Now Playing";

            activeIndex = -1;
            lyric.classList.remove("show");

            requestAnimationFrame(updateLyrics);

        } catch (error) {

            statusText.textContent =
                "Audio tidak ditemukan";

        }

    } else {

        audio.pause();

        playBtn.textContent = "▶ PLAY";
        statusText.textContent = "Paused";

        lyric.classList.remove("show");
    }
});

// Progress lagu
audio.addEventListener("timeupdate", () => {

    if (audio.duration) {

        progress.value =
            (audio.currentTime / audio.duration) * 100;

        document.getElementById("current").textContent =
            formatTime(audio.currentTime);
    }
});

progress.addEventListener("input", () => {

    if (audio.duration) {

        audio.currentTime =
            (progress.value / 100) * audio.duration;

        activeIndex = -1;
        lyric.classList.remove("show");

        if (!audio.paused) {
            requestAnimationFrame(updateLyrics);
        }
    }
});

audio.addEventListener("loadedmetadata", () => {

    document.getElementById("duration").textContent =
        formatTime(audio.duration);
});

audio.addEventListener("ended", () => {

    playBtn.textContent = "▶ PLAY";
    statusText.textContent = "Music Finished";

    lyric.classList.remove("show");
    activeIndex = -1;
    progress.value = 0;
});

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) return "0:00";

    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);

    return min + ":" + String(sec).padStart(2,"0");
}

</script>

</body>
</html>
